[project]
name = "context-compiler"
version = "0.1.0"
description = "Deterministic backend foundation for Context Compiler"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "clickhouse-connect>=1.6.0",
    "fastapi>=0.141.1",
    "langfuse>=4.14.2",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.14.2",
    "python-multipart>=0.0.32",
    "uvicorn>=0.52.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "ruff>=0.16.1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.ruff.format]
quote-style = "double"
