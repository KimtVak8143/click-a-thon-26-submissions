name: context-compiler-ui

services:
  dashboard:
    build: .
    container_name: context-compiler-dashboard
    ports:
      - "4173:80"
    restart: unless-stopped

  librechat:
    image: registry.librechat.ai/danny-avila/librechat:latest
    container_name: context-compiler-librechat
    ports:
      - "3080:3080"
    depends_on:
      - mongodb
      - meilisearch
    env_file:
      - .env
    environment:
      HOST: 0.0.0.0
      PORT: 3080
      MONGO_URI: mongodb://mongodb:27017/LibreChat
      MEILI_HOST: http://meilisearch:7700
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./librechat.yaml:/app/librechat.yaml:ro
      - ./uploads:/app/uploads
      - ./logs:/app/logs
    restart: unless-stopped

  mongodb:
    image: mongo:8.0.20
    container_name: context-compiler-chat-mongodb
    command: mongod --noauth
    volumes:
      - ./librechat-data:/data/db
    restart: unless-stopped

  meilisearch:
    image: getmeili/meilisearch:v1.35.1
    container_name: context-compiler-chat-meilisearch
    environment:
      MEILI_NO_ANALYTICS: "true"
      MEILI_MASTER_KEY: "${MEILI_MASTER_KEY}"
    volumes:
      - ./meili-data:/meili_data
    restart: unless-stopped
