name: context-compiler-ui

services:
  dashboard:
    build: .
    container_name: context-compiler-dashboard
    ports:
      - "4173:80"
    restart: unless-stopped

  librechat:
    image: registry.librechat.ai/danny-avila/librechat:latest
    container_name: context-compiler-librechat
    ports:
      - "3080:3080"
    depends_on:
      - mongodb
      - meilisearch
    env_file:
      - .env
    environment:
      HOST: 0.0.0.0
      PORT: 3080
      MONGO_URI: mongodb://mongodb:27017/LibreChat
      MEILI_HOST: http://meilisearch:7700
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./librechat.yaml:/app/librechat.yaml:ro
      - ./uploads:/app/uploads
      - ./logs:/app/logs
    restart: unless-stopped

  mongodb:
    image: mongo:8.0.20
    container_name: context-compiler-chat-mongodb
    command: mongod --noauth
    volumes:
      - ./librechat-data:/data/db
    restart: unless-stopped

  meilisearch:
    image: getmeili/meilisearch:v1.35.1
    container_name: context-compiler-chat-meilisearch
    environment:
      MEILI_NO_ANALYTICS: "true"
      MEILI_MASTER_KEY: "${MEILI_MASTER_KEY}"
    volumes:
      - ./meili-data:/meili_data
    restart: unless-stopped

  # Official ClickHouse MCP server (https://github.com/ClickHouse/mcp-clickhouse),
  # so LibreChat can run live, read-only queries against the same ClickHouse Cloud
  # service the Context Compiler backend deploys tables into. Read-only by default
  # (CLICKHOUSE_ALLOW_WRITE_ACCESS unset), independent of app-level credentials.
  mcp-clickhouse:
    image: python:3.12-slim
    container_name: context-compiler-mcp-clickhouse
    command: sh -c "pip install --no-cache-dir mcp-clickhouse==0.4.1 && exec mcp-clickhouse"
    environment:
      CLICKHOUSE_HOST: "${MCP_CLICKHOUSE_HOST}"
      CLICKHOUSE_PORT: "${MCP_CLICKHOUSE_PORT:-8443}"
      CLICKHOUSE_USER: "${MCP_CLICKHOUSE_USER}"
      CLICKHOUSE_PASSWORD: "${MCP_CLICKHOUSE_PASSWORD}"
      CLICKHOUSE_SECURE: "${MCP_CLICKHOUSE_SECURE:-true}"
      CLICKHOUSE_DATABASE: "${MCP_CLICKHOUSE_DATABASE}"
      CLICKHOUSE_MCP_SERVER_TRANSPORT: http
      CLICKHOUSE_MCP_BIND_HOST: 0.0.0.0
      CLICKHOUSE_MCP_BIND_PORT: "8001"
      # Static bearer tokens still trip LibreChat's MCP client into permanently
      # treating the server as OAuth-required (its 401 response is indistinguishable
      # from an OAuth challenge to that client), so auth is disabled here instead.
      # Development/local-demo only — this is only reachable inside the docker
      # network plus whatever reaches the host's mapped 8001 port. Read access is
      # still the only thing exposed: CLICKHOUSE_ALLOW_WRITE_ACCESS stays unset.
      CLICKHOUSE_MCP_AUTH_DISABLED: "true"
    ports:
      - "8001:8001"
    restart: unless-stopped
